
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Investment Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
    padding: 15px;
}
.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 22px;
    border-radius: 15px;
}
h1 {
    text-align: center;
    color: #2457d6;
}
label {
    display: block;
    margin-top: 16px;
    font-weight: bold;
}
input, select {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background: #2457d6;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
}
.result {
    margin-top: 20px;
    padding: 15px;
    background: #e8f8ee;
    border-radius: 10px;
    line-height: 2;
}
canvas {
    margin-top: 25px;
}
.note {
    color: #666;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h1>💰 SIP Calculator</h1>

<label>Monthly Investment (₹)</label>
<input type="number" id="amount" value="1000" min="1">

<label>Investment Years</label>
<input type="number" id="years" value="20" min="1" max="50">

<label>Expected Annual Return (%)</label>
<input type="number" id="rate" value="12" min="0" max="50" step="0.5">

<label>Yearly SIP Increase</label>
<select id="stepup">
<option value="0">0%</option>
<option value="5">5%</option>
<option value="10" selected>10%</option>
<option value="15">15%</option>
<option value="20">20%</option>
</select>

<button onclick="calculate()">Calculate Investment</button>

<div class="result" id="result">
<h3>Your Investment Result</h3>
Enter your details and calculate.
</div>

<h2>📈 Investment Growth Graph</h2>

<canvas id="myChart"></canvas>

<p class="note">
Note: Returns are estimated, not guaranteed.
Mutual funds are subject to market risks.
</p>

</div>

<script>

let myInvestmentChart = null;

function calculate() {

    let amount = Number(document.getElementById("amount").value);
    let years = Number(document.getElementById("years").value);
    let rate = Number(document.getElementById("rate").value);
    let stepup = Number(document.getElementById("stepup").value);

    if (!Number.isFinite(amount) || amount <= 0 ||
        !Number.isInteger(years) || years < 1 || years > 50 ||
        !Number.isFinite(rate) || rate < 0 || rate > 50) {
        alert("Please enter valid values!");
        return;
    }

    let monthlyRate = rate / 100 / 12;

    let totalInvestment = 0;
    let finalValue = 0;

    let labels = [];
    let investedData = [];
    let valueData = [];

    for (let year = 1; year <= years; year++) {

        let sip = amount * Math.pow(1 + stepup / 100, year - 1);

        for (let month = 1; month <= 12; month++) {

            totalInvestment += sip;

            finalValue =
                finalValue * (1 + monthlyRate) + sip;
        }

        labels.push(year + " Year");
        investedData.push(totalInvestment);
        valueData.push(finalValue);
    }

    let profit = finalValue - totalInvestment;

    function money(value) {
        return "₹" + Math.round(value).toLocaleString("en-IN");
    }

    document.getElementById("result").innerHTML = `
        <h3>Investment Result</h3>

        Total Investment: ${money(totalInvestment)}<br>

        Estimated Profit: ${money(profit)}<br>

        <h2>Final Value: ${money(finalValue)}</h2>
    `;

    if (myInvestmentChart) {
        myInvestmentChart.destroy();
    }

    myInvestmentChart = new Chart(
        document.getElementById("myChart"),
        {
            type: "line",

            data: {
                labels: labels,

                datasets: [
                    {
                        label: "Total Investment",
                        data: investedData,
                        borderWidth: 3,
                        tension: 0.3
                    },
                    {
                        label: "Investment Value",
                        data: valueData,
                        borderWidth: 3,
                        tension: 0.3
                    }
                ]
            },

            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: "bottom"
                    }
                }
            }
        }
    );
}

calculate();

</script>

</body>
</html>
